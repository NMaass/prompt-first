name: Apply repository reset

on:
  push:
    branches: [codex/agentic-studio-reset]
    paths: [.reset/**]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/agentic-studio-reset
          fetch-depth: 0
      - name: Reconstruct reset tree
        shell: bash
        run: |
          set -euo pipefail
          cp LICENSE /tmp/prompt-first-license
          cat .reset/chunk-* | base64 --decode > /tmp/prompt-first-reset.tar.gz
          test "$(sha256sum /tmp/prompt-first-reset.tar.gz | cut -d' ' -f1)" = "feb118011aa9d4a8969ff7f514f6d0a9fc436e34b0f3c9c192e1c3694c2be905"
          mkdir /tmp/prompt-first-reset
          tar -xzf /tmp/prompt-first-reset.tar.gz -C /tmp/prompt-first-reset
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/prompt-first-reset/. .
          cp /tmp/prompt-first-license LICENSE
      - name: Commit reset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete agentic product studio phases"
          git push origin HEAD:codex/agentic-studio-reset
